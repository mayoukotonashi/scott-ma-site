<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <meta name="description" content="$description">
  <link rel="canonical" href="$canonical">
  <meta name="robots" content="index, follow, max-image-preview:large">
  $social_head
  <meta name="theme-color" content="#faf9f6">
  $favicon_head
  <link rel="stylesheet" href="${root}assets/identity.css">
  $extra_head
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead"><div class="wrap mast-inner">
    <a class="signature" href="$root" aria-label="$name, home"><img width="58" height="58" src="${root}assets/woman-with-cat.webp" alt="">$name</a>
    <nav aria-label="Main navigation">$navigation<a href="mailto:$email">Contact</a></nav>
  </div></header>
  <main id="main">$content</main>
  <footer class="foot"><div class="wrap colophon"><a href="$root">$name</a><a href="${root}privacy/">Privacy</a></div></footer>
</body></html>
